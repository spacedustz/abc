<style>
:root {
  --bg: #0b0d12;

  --text: #eef2f8;
  --accent: #9ee6b0;
  --line: #283142;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: radial-gradient(ellipse at top, #192333 0, #0b0d12 58%);
  color: var(--text);
  font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
  min-height: 100vh;
}

.wrap {
  width: min(850px, 100%);
  margin: auto;
  padding: 20px 16px 44px;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}

.title {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: .03em;
}

.sub {
  color: var(--muted);
  font-size: 12px;
  margin-top: 2px;
}

.pill {
  border: 1px solid #344257;
  border-radius: 999px;
  padding: 6px 10px;
  color: var(--accent);
  font-size: 11px;
  white-space: nowrap;
}

.player {
  background: rgba(20, 25, 35, .96);
  border: 1px solid var(--line);
  border-radius: 17px;
  padding: 14px 16px;
  position: sticky;
  top: 8px;
  z-index: 3;
  box-shadow: 0 12px 35px #0006;
}

.file {
  display: flex;
  gap: 10px;
  align-items: center;
}

.file strong { display: block; }
.file small {
  color: var(--muted);
  font-size: 12px;
}

audio {
  width: 100%;
  margin-top: 10px;
  height: 38px;
  accent-color: var(--accent);
}

.controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
  margin-top: 4px;
  flex-wrap: wrap;
}

.toggles {
  display: flex;
  gap: 16px;
  align-items: center;
}

.toggle {
  display: flex;
  gap: 8px;
  align-items: center;
  cursor: pointer;
  user-select: none;
  font-size: 12px;
  color: var(--muted);
}

.toggle input {
  position: absolute;
  opacity: 0;
  cursor: pointer;
  height: 0;
  width: 0;
}

.slider {
  position: relative;
  display: inline-block;
  width: 34px;
  height: 20px;
  background-color: #283142;
  border-radius: 20px;
  transition: .25s;
  border: 1px solid #344257;
}

.slider:before {
  position: absolute;
  content: "";
  height: 14px;
  width: 14px;
  left: 2px;
  bottom: 2px;
  background-color: var(--muted);
  border-radius: 50%;
  transition: .25s;
}

.toggle input:checked + .slider {
  background-color: var(--accent);
  border-color: var(--accent);
}

.toggle input:checked + .slider:before {
  transform: translateX(14px);
  background-color: #0b0d12;
}

.lyrics {
  margin: 18px auto 0;
  max-width: 720px;
  padding: 22vh 8px;
  min-height: 68vh;
  overflow: hidden;
  mask-image: linear-gradient(transparent 0%, black 10%, black 90%, transparent 100%);
}

.line {
  text-align: center;
  padding: 13px 9px;
  margin: 5px 0;
  border-radius: 12px;
  opacity: .48;
  transform: scale(.97);
  transition: all .25s;
  scroll-margin: 40vh;
}

.en {
  font-size: clamp(18px, 3.5vw, 25px);
  font-weight: 700;
  line-height: 1.4;
  color: #c4ccda;
}

.ko {
  font-size: clamp(14px, 2.8vw, 18px);
  font-weight: 500;
  line-height: 1.5;
  color: #9ca8ba;
  margin-top: 5px;
}

.line.past { opacity: .6; }
.line.past .en { color: #aeb8c8; }
.line.past .ko { color: #8793a6; }

.line.future { opacity: .58; }

.line.active {
  opacity: 1;
  transform: scale(1.02);
  background: #9ee6b00c;
  box-shadow: inset 0 0 0 1px #9ee6b022;
}

.line.active .en {
  color: var(--accent);
  text-shadow: 0 0 22px #9ee6b033;
}

.line.active .ko { color: #f1f4f8; }

.note {
  text-align: center;
  color: var(--muted);
  font-size: 11px;
  margin-top: 10px;
}

@media(max-width: 600px) {

  .title { font-size: 21px; }
  .player { top: 4px; padding: 12px; }
  .lyrics { padding: 20vh 3px; }

}

const early = document.getElementById('early');
const loop = document.getElementById('loop');
const clock = document.getElementById('clock');

// 1. 페이지 로드 직후 무조건 가사 엘리먼트들을 생성해서 화면에 꽂아넣습니다.
const nodes = entries.map((e, i) => {
  const d = document.createElement('section');
  d.className = 'line future';
  d.dataset.i = i;
  const en = document.createElement('div');
  en.className = 'en';
  en.textContent = e.en;
  const ko = document.createElement('div');
  ko.className = 'ko';
  ko.textContent = e.ko;
  d.append(en, ko);
  root.appendChild(d);
  return d;
});

let active = -1;

function fmt(s) {
  if (!Number.isFinite(s)) return '00:00';
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');
}

function update() {
  const t = audio.currentTime + (early.checked ? 1 : 0);
  let idx = -1;
  for (let i = 0; i < entries.length; i++) {
    if (entries[i].t <= t) idx = i;
    else break;
  }
  if (idx !== active) {
    active = idx;
    nodes.forEach((n, i) => {
      n.className = 'line ' + (i === idx ? 'active' : i < idx ? 'past' : 'future');
    });
    if (idx >= 0) nodes[idx].scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  clock.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
}

audio.addEventListener('timeupdate', update);
audio.addEventListener('seeked', update);
audio.addEventListener('loadedmetadata', update);
audio.addEventListener('play', update);
early.addEventListener('change', update);
loop.addEventListener('change', () => { audio.loop = loop.checked; });
audio.addEventListener('ended', () => {
  nodes.forEach(n => n.classList.remove('active'));
});
